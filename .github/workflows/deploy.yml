name: Deploy to itch.io

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to itch.io
        uses: Kikobeats/itch-publish@v1
        with:
          butlerApiKey: ${{ secrets.BUTLER_API_KEY }}
          gameData: ./
          itchUsername: crazysun0724
          itchGameId: solitaire-321
          buildChannel: html
